<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta input</title>
</head>
<body>
    <input type="text" style="border: 2px solid #4a7c59; border-radius: 5px; padding: 8px;" placeholder="Nombre"><br><br>

    <input type="password" style="border: 2px solid #4a7c59; border-radius: 5px; padding: 8px;" placeholder="Contraseña"><br><br>

    <input type="email" style="border: 2px solid #4a7c59; border-radius: 5px; padding: 8px;" placeholder="correo@ejemplo.com"><br><br>

    <input type="search" style="border: 2px solid #4a7c59; border-radius: 5px; padding: 8px;" placeholder="Buscar..."><br><br>

    <input type="radio" style="width: 20px; height: 20px; accent-color: #4a7c59;"><br><br>

    <input type="checkbox" style="width: 20px; height: 20px; accent-color: #4a7c59;"><br><br>

    <input type="button" value="Click aquí" style="background-color: #4a7c59; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;"><br><br>

    <input type="submit" value="Enviar" style="background-color: #2e5940; color: white; padding: 10px 20px; border: none; border-radius: 5px;"><br><br>

    <input type="reset" value="Limpiar" style="background-color: #a3a3a3; color: white; padding: 10px 20px; border: none; border-radius: 5px;"><br><br>
    
    <input type="number" style="width: 100px; padding: 8px; border: 2px solid #4a7c59;"><br><br>

    <input type="range" style="width: 250px; accent-color: #4a7c59;"><br><br>

    <input type="date" style="padding: 8px; border: 2px solid #4a7c59; border-radius: 5px;"><br><br>

    <input type="time" style="padding: 8px; border: 2px solid #4a7c59;"><br><br>

    <input type="datetime-local" style="padding: 8px; border: 2px solid #4a7c59;"><br><br>

    <input type="week" style="padding: 8px; border: 2px solid #4a7c59;"><br><br>

    <input type="month" style="padding: 8px; border: 2px solid #4a7c59;"><br><br>

    <input type="file" style="border: 2px dashed #4a7c59; padding: 10px;"><br><br>

    <input type="color" style="width: 60px; height: 40px; border: none;"><br><br>

    <input type="url" style="padding: 8px; border: 2px solid #4a7c59;" placeholder="https://ejemplo.com"><br><br>

    <input type="hidden" value="dato-oculto"><br><br>

    <input type="image" src="boton.png" alt="Botón de imagen" style="width: 60px;">
</body>
</html>
