<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiquetas y atributos</title>
</head>
<body>
    <h1 id="titulo-principal" class="encabezado" title="Este es el título principal">Encabezado H1</h1><br>
    <h2 id="titulo-secundario" class="encabezado" title="Segundo nivel">Encabezado H2</h2><br>
    <h3 style="color: darkgreen;" title="Tercer nivel">Encabezado H3</h3><br>
    <h4 style="color: gray;" title="Cuarto nivel">Encabezado H4</h4><br>
    <h5 class="pequeno" title="Quinto nivel">Encabezado H5</h5><br>
    <h6 class="pequeno" title="Sexto nivel">Encabezado H6</h6>

    <img src="foto.jpg" alt="Descripción de la imagen" width="300" height="300" title="Mi foto de ejemplo">

    <video src="video.mp4" controls width="400" autoplay muted title="Mi video de ejemplo">
        Tu navegador no soporta la etiqueta de video.
    </video>

    <table border="1" style="width:100%; text-align:center;" cellpadding="10">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>25</td>
        </tr>
        <tr>
            <td>Ana</td>
            <td>30</td>
        </tr>
    </table>

    <textarea rows="5" cols="40" placeholder="Escribe tu comentario aquí..." maxlength="200"></textarea>
</body>
</html>
